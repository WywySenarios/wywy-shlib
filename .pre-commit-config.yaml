# Pre-commit hooks for wywy-shlib.
#
# Install once per clone:  pre-commit install
# Run against everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: shell-lint
        name: shell lint
        entry: scripts/tests/lint.sh
        language: system
        pass_filenames: false
        files: \.sh$
      - id: shell-unit
        name: shell unit
        entry: scripts/tests/unit.sh
        language: system
        pass_filenames: false
        files: \.sh$
